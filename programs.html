<!DOCTYPE html>
<html lang="ko">
<head>

<body>
  <div class="header">

  <script>
    // 프로그램 카드 렌더링
    const cardsContainer = document.getElementById('program-cards');
    Object.values(PROGRAMS).forEach(program => {
      cardsContainer.innerHTML += renderProgramCard(program);
    });
