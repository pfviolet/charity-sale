<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>예약 완료 - 기부 바자회</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="header">
    <div class="header-inner">
      <span class="header-title">예약 완료</span>
    </div>
  </div>

  <div class="container">
    <div class="confirm-wrap">
      <div class="confirm-icon">🎉</div>
      <h2 class="confirm-title">예약이 완료되었습니다!</h2>
      <p class="confirm-subtitle">아래 예약번호를 기억해주세요</p>

      <div class="booking-number-box">
        <div class="booking-number-label">예약번호</div>
        <div class="booking-number" id="booking-number"></div>
      </div>

      <div class="confirm-details" id="confirm-details">
        <!-- JS에서 렌더링 -->
      </div>

      <div class="confirm-note">
        📌 예약 조회 및 취소는 예약번호 또는 전화번호로 가능합니다.<br>
        📌 행사 당일 현장에서 예약번호를 확인해주세요.
      </div>

      <div class="confirm-buttons">
        <button class="btn-primary" onclick="shareKakao(programId)">
          💬 카카오톡으로 공유하기
        </button>
        <a href="index.html" class="btn-secondary">홈으로 돌아가기</a>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const bookingNum = params.get('booking');
    const programId = params.get('program');
    const slotId = parseInt(params.get('slot'));
    const applicantName = params.get('name');
    const count = params.get('count');

    const program = PROGRAMS[programId];
    const slot = TIME_SLOTS.find(s => s.id === slotId);

    if (!bookingNum || !program || !slot) {
      location.href = 'index.html';
    }

    document.getElementById('booking-number').textContent = bookingNum;

    document.getElementById('confirm-details').innerHTML = `
      <div class="detail-row">
        <span class="detail-label">프로그램</span>
        <span class="detail-value">${program.shortTitle}</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">일시</span>
        <span class="detail-value">${EVENT_INFO.dateShort} ${slot.time}</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">신청자</span>
        <span class="detail-value">${applicantName}</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">참여 인원</span>
        <span class="detail-value">${count}명</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">참가비</span>
        <span class="detail-value">무료</span>
      </div>
    `;
  </script>
</body>
</html>
